server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: classpath:bank-defaults.yml
  security:
    oauth2:
      client:
        registration:
          login:
            provider: idp
            client-id: ${IDP_CLIENT_ID:gateway-not-configured}
            client-secret: ${IDP_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            # Only identity scopes. API access comes from the user's groups, never from API scopes,
            # so the identity provider cannot hand a viewer an admin scope by accident.
            scope: openid,profile,email
        provider:
          # Explicit endpoints (no startup call to the identity provider), Keycloak's paths under the shared issuer.
          # For Okta or Auth0 set these four (and bank.gateway.idp-logout-uri) to that provider's endpoints.
          idp:
            authorization-uri: ${bank.idp.issuer-uri}/protocol/openid-connect/auth
            token-uri: ${bank.idp.issuer-uri}/protocol/openid-connect/token
            jwk-set-uri: ${bank.idp.issuer-uri}/protocol/openid-connect/certs
            user-info-uri: ${bank.idp.issuer-uri}/protocol/openid-connect/userinfo
            user-name-attribute: sub
  # Login sessions (who is signed in, their tokens, a login in progress) live in Redis, not in this process.
  # They hold access tokens: Redis must be private and password protected (TLS in the cloud).
  data:
    redis:
      host: ${REDIS_HOST:redis-not-configured.invalid}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
  session:
    timeout: 30m                     # signed out after 30 minutes without activity
    redis:
      namespace: account-upgrade:gateway
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - TokenRelay=              # signed-in users: send their access token downstream
            - RemoveRequestHeader=Cookie   # the browser session stays at the gateway
          routes:
            - id: ingestion
              uri: http://localhost:8081
              predicates:
                - Path=/api/files/**,/api/jobs/ingestion/**
            - id: upgrade
              uri: http://localhost:8082
              predicates:
                - Path=/api/upgrades/**,/api/jobs/upgrade/**
            - id: communication
              uri: http://localhost:8083
              predicates:
                - Path=/api/notifications/**
            - id: audit
              uri: http://localhost:8085
              predicates:
                - Path=/api/audit/**

bank:
  gateway:
    # Signing out of the console also ends the session at the identity provider (OIDC RP-initiated logout);
    # empty = only the gateway session ends
    idp-logout-uri: ${bank.idp.issuer-uri}/protocol/openid-connect/logout

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus   # /actuator/prometheus needs the metrics.read scope
  metrics:
    tags:
      application: ${spring.application.name}   # Grafana groups by service; copies differ by instance
