# Single-node Kafka (KRaft) with TLS, SCRAM logins and ACLs. LOCAL USE ONLY.
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@localhost:9093
controller.listener.names=CONTROLLER

# Apps on your machine use EXTERNAL (localhost:9094); containers in this compose project use INTERNAL
# (kafka-secure:9097). Both are TLS + SCRAM. BROKER and CONTROLLER are plain text but bound to the container's
# own loopback, so only the broker itself can reach them (no other container, and nothing on your machine).
listeners=EXTERNAL://:9094,INTERNAL://:9097,BROKER://127.0.0.1:9096,CONTROLLER://127.0.0.1:9093
advertised.listeners=EXTERNAL://localhost:9094,INTERNAL://kafka-secure:9097,BROKER://127.0.0.1:9096
inter.broker.listener.name=BROKER
listener.security.protocol.map=EXTERNAL:SASL_SSL,INTERNAL:SASL_SSL,BROKER:PLAINTEXT,CONTROLLER:PLAINTEXT

sasl.enabled.mechanisms=SCRAM-SHA-512
listener.name.external.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
listener.name.internal.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
ssl.keystore.type=PKCS12
ssl.keystore.location=/certs/broker.p12
ssl.keystore.password=kafka-local-tls
ssl.key.password=kafka-local-tls
ssl.client.auth=none

# Nobody can do anything unless an ACL says so. admin is the only super user, plus ANONYMOUS, which on this
# broker can only be the broker's own internal traffic on the loopback-only listeners above.
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
super.users=User:admin;User:ANONYMOUS
allow.everyone.if.no.acl.found=false

# Topics are created by the init job, so a typo in a topic name fails instead of creating a new topic
auto.create.topics.enable=false

offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
group.initial.rebalance.delay.ms=0
log.dirs=/var/lib/kafka/data
