apiVersion: 1
providers:
  # Dashboards are files in infra/monitoring/grafana/dashboards. Change them there (or export from Grafana and
  # save over the file); changes made in the Grafana UI are not kept.
  - name: account-upgrade
    folder: Account upgrade
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards
