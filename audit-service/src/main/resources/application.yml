server:
  port: 8085

spring:
  application:
    name: audit-service
  config:
    import: classpath:bank-defaults.yml, classpath:bank-persistence-defaults.yml, classpath:bank-messaging-defaults.yml
  # Injected by the environment (Vault / secrets). Local values are in application-local.yml.
  datasource:
    username: ${DB_USER}
    password: ${DB_PASSWORD}

bank:
  processed-events:
    enabled: true      # shared PROCESSED_EVENT table (consumer de-duplication)
  audit:
    archive:
      # Months that ended more than 400 days ago move from AUDIT_EVENT to one gzip file each (JSON lines).
      # Real environments mount durable storage here; see docs/adr/0022-audit-archive.md.
      dir: ${AUDIT_ARCHIVE_DIR:audit-archive}
      keep: 400d

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus   # /actuator/prometheus needs the metrics.read scope
  metrics:
    tags:
      application: ${spring.application.name}   # Grafana groups by service; copies differ by instance
