# Local development stack. Credentials below are for local use only.
services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: oracle_local_pw
    ports:
      - "1521:1521"
    volumes:
      - ./infra/oracle-init:/container-entrypoint-initdb.d:ro
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT for the apps on this machine (localhost:9092), DOCKER for other containers (kafka:29092)
      KAFKA_LISTENERS: PLAINTEXT://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Topics are created on first use; 6 partitions let up to 6 copies of a service share a topic's messages
      KAFKA_NUM_PARTITIONS: 6

  # Web UI for the local Kafka: topics, messages (with headers), consumer groups and their lag.
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.4.2
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "false"
    ports:
      - "8070:8080"
    depends_on:
      - kafka

  # Secured Kafka for practising the real setup: TLS + a SCRAM login per service + ACLs.
  # Start with:  ./infra/kafka-secure/generate-certs.sh   (once)
  #              docker compose --profile secure up -d kafka-secure kafka-secure-init
  kafka-secure:
    profiles: ["secure"]
    image: apache/kafka:3.9.0
    entrypoint: ["/bin/bash", "/config/start.sh"]
    ports:
      - "9094:9094"
    volumes:
      - ./infra/kafka-secure:/config:ro
      - ./infra/kafka-secure/certs:/certs:ro
      - kafka-secure-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka-secure:9097 --command-config /config/admin.properties >/dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 20s

  kafka-secure-init:
    profiles: ["secure"]
    image: apache/kafka:3.9.0
    depends_on:
      kafka-secure:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/config/init-acls.sh"]
    volumes:
      - ./infra/kafka-secure:/config:ro
      - ./infra/kafka-secure/certs:/certs:ro
    restart: "no"

  sftp:
    # atmoz publishes no version tags, so pinned by digest (the 2024-07-14 build of "latest")
    image: atmoz/sftp@sha256:0960390462a4441dbb63698d7c185b76a41ffcee7b78ff4adf275f3e66f9c475
    # user:password:uid:gid:dir  -> upload folder /home/bank/incoming
    command: bank:bank_local_pw:1001:100:incoming,processed,error
    ports:
      - "2222:22"
    volumes:
      - sftp-data:/home/bank

  # Identity provider for local development (instead of Okta): realm "account-upgrade" with test users and the
  # apps' OAuth2 clients, created by keycloak-setup. Admin console: http://localhost:8180 (admin / admin).
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.2
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Tokens always name http://localhost:8180 as issuer, also when the setup container calls keycloak:8080
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8180:8080"

  keycloak-setup:
    image: quay.io/keycloak/keycloak:26.4.2
    entrypoint: ["/bin/bash", "/setup/setup-realm.sh"]
    volumes:
      - ./infra/keycloak:/setup:ro
    depends_on:
      - keycloak
    restart: "no"

  # Shared login sessions for the gateway (Spring Session), so a restart or a second gateway copy keeps people signed in
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--requirepass", "local-redis-pw", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI

  # Monitoring (infra/monitoring). Prometheus scrapes the services running on this machine every 5 s, logging in
  # to Keycloak as the "prometheus" client (scope metrics.read); Grafana shows the "Account upgrade" dashboard.
  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"   # the services run on this machine, not in compose
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:13.2.5
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Local only: anyone on this machine may look without signing in
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/account-upgrade.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    ports:
      - "3000:3000"

volumes:
  oracle-data:
  sftp-data:
  kafka-secure-data:
  prometheus-data:
