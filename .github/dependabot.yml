# Dependabot opens pull requests for newer versions; CI checks each one. Grouped, so one week's updates of a kind come
# as one pull request instead of many. Security updates (for known vulnerabilities) also need "Dependabot alerts"
# switched on in the repository's Settings > Advanced Security.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /ops-ui
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    groups:
      images:
        patterns: ["*"]
