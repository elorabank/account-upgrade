# PAUSED: every ecosystem below has open-pull-requests-limit: 0, which stops version-update pull requests while
# keeping the rules. To resume, set the limits back (5 for maven and npm; remove the line for the other two).
# Security updates, if switched on in Settings > Advanced Security, are not affected by this limit.
#
# Dependabot opens pull requests for newer versions; CI checks each one. Grouped, so one week's updates of a kind come
# as one pull request instead of many. Security updates (for known vulnerabilities) also need "Dependabot alerts"
# switched on in the repository's Settings > Advanced Security.
#
# Only minor and patch versions are proposed for libraries and images. A major version (Spring Boot 4, Vite 8, Kafka 4,
# ...) changes APIs and is a migration of its own: do it on purpose, on its own branch, not as a weekly bot update.
# GitHub actions are the exception: their major versions are usually just a newer Node.js runtime, and CI itself runs
# them, so a green run is real evidence.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Spring Cloud numbers releases by year, so 2025.0 -> 2025.1 looks minor, but 2025.1 is the release for
      # Spring Boot 4. It belongs to that migration; remove this rule when moving to Boot 4.
      - dependency-name: "org.springframework.cloud:spring-cloud-dependencies"
        versions: [">= 2025.1"]
    groups:
      maven:
        patterns: ["*"]
    open-pull-requests-limit: 0   # paused (was 5)

  - package-ecosystem: npm
    directory: /ops-ui
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # React and its type definitions must stay on the same version: always in one pull request
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      npm:
        patterns: ["*"]
    open-pull-requests-limit: 0   # paused (was 5)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0   # paused
    groups:
      actions:
        patterns: ["*"]

  # CI does not start docker-compose, so a green run says nothing about a new image: try it locally before merging
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0   # paused
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      images:
        patterns: ["*"]
