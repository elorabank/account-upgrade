name: security
on:
  schedule:
    - cron: "0 4 * * 1"   # Mondays 04:00 UTC: new vulnerabilities are published all the time, not only when we change code
  workflow_dispatch:
jobs:
  dependency-check:
    runs-on: ubuntu-latest
    env:
      # Repository secret (free key from https://nvd.nist.gov/developers/request-an-api-key); without it the check is skipped
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Explain the skip
        if: env.NVD_API_KEY == ''
        run: echo "::warning::OWASP dependency-check skipped. Add the NVD_API_KEY repository secret to run it."
      - name: Keep the vulnerability database between runs
        if: env.NVD_API_KEY != ''
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-
      - name: OWASP dependency-check (fails on CVSS 9 or more)
        if: env.NVD_API_KEY != ''
        run: mvn -B -DskipTests install org.owasp:dependency-check-maven:aggregate
      - name: Keep the report
        if: always() && env.NVD_API_KEY != ''
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
          if-no-files-found: ignore
