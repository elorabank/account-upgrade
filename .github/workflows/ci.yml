name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build and test
        # Unit and API tests only: no Docker, no database (real-database checks are local, see README "Tests")
        run: mvn -B verify
      # Add later: Sonar scan and OWASP dependency-check (org.owasp:dependency-check-maven).
