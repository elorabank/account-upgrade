server:
  port: 8082

spring:
  application:
    name: account-upgrade-service
  config:
    import: classpath:bank-defaults.yml, classpath:bank-persistence-defaults.yml, classpath:bank-messaging-defaults.yml
  # Injected by the environment (Vault / secrets). Local values are in application-local.yml.
  datasource:
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  security:
    oauth2:
      client:
        # This service's own client at the identity provider (client credentials). It may only ask for staging.read.
        registration:
          service:
            provider: idp
            client-id: ${IDP_CLIENT_ID:upgrade-client-not-configured}
            client-secret: ${IDP_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
            scope: staging.read
        provider:
          idp:
            token-uri: ${bank.idp.issuer-uri}/protocol/openid-connect/token

  # Redis holds the core-call limit shared by all copies (bank.upgrade.core-calls-per-second)
  data:
    redis:
      host: ${REDIS_HOST:redis-not-configured.invalid}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus   # /actuator/prometheus needs the metrics.read scope
  metrics:
    tags:
      application: ${spring.application.name}   # Grafana groups by service; copies differ by instance
  health:
    # Without Redis the limit is skipped (calls still capped per copy), so it does not make the service DOWN
    redis:
      enabled: false

bank:
  processed-events:
    enabled: true      # shared PROCESSED_EVENT table (consumer de-duplication)
  outbox:
    enabled: true      # shared OUTBOX_EVENT table
  security:
    client:
      registration-id: service   # client-credentials token for calls to other services
  upgrade:
    ingestion-url: ${INGESTION_URL:http://localhost:8081}
    schedule:
      cron: "0 0 3 * * *"      # daily at 03:00 in bank.time-zone, on every copy (they share one run)
    instance-id: ${UPGRADE_INSTANCE_ID:}           # start of this copy's name (e.g. the pod name); a random part is always added
    lease: 2m                                      # a copy that dies loses its claims after this
    core-calls-per-second: ${UPGRADE_CORE_CALLS_PER_SECOND:0}   # all copies together; 0 = no shared limit
    # Draft rules until the business confirms them
    rules:
      required-kyc-status: VERIFIED
      min-balance: 0
      target-types:
        SAVINGS: SAVINGS_PLUS
        CURRENT: CURRENT_PLUS
